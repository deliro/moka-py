[build-system]
requires = ["maturin == 1.14.1"]
build-backend = "maturin"

[tool.maturin]
python-source = "py-src"
module-name = "moka_py._moka_py"

[project]
name = "moka-py"
description = "A high performance caching library for Python written in Rust"
requires-python = ">= 3.10"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/deliro/moka-py"
Repository = "https://github.com/deliro/moka-py"
Issues = "https://github.com/deliro/moka-py/issues"

[dependency-groups]
maturin = [
    "maturin == 1.14.1 ; sys_platform != 'linux'",
    "maturin[patchelf] == 1.14.1 ; sys_platform == 'linux'",
]
pytest = ["pytest == 9.1.1", "pytest-cov == 7.1.0"]
ci = [
    { include-group = "maturin" },
    { include-group = "pytest" },
    "pytest-asyncio == 1.4.0",
]
wasm-test = [
    { include-group = "pytest" },
    "pytest-pyodide == 0.59.2",
    "pytest-httpserver == 1.1.5",
]
dev = [
    { include-group = "ci" },
    "pytest-benchmark == 5.2.3",
    "ruff==0.16.3",
]

[tool.uv.dependency-groups]
wasm-test = { requires-python = ">=3.13" }

[tool.pytest.ini_options]
addopts = "--doctest-modules --doctest-continue-on-failure"
doctest_optionflags = "ELLIPSIS NORMALIZE_WHITESPACE"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py310"
# The package lives in py-src/, so ruff's default `src = ["."]` fails to
# recognise `moka_py` as first-party and isort merges it into the
# third-party block. Only masked locally by a stale ./moka_py build dir.
src = ["py-src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "ISC",
    "D",
    "S",
    "RUF",
    "C90",
]
ignore = [
    "E501", # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101", # asserts are fine in tests
    "S311", # non-crypto randomness in tests
    "D",    # ignore docstring requirements in tests
]
"**/__init__.py" = [
    "D104", # package-level docstring optional
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.coverage.run]
# source_pkgs, not source: `moka_py` is a package name. With plain `source`,
# coverage resolves it against the working directory first, so a stale
# ./moka_py build directory silently shadows the installed package and
# nothing is measured.
source_pkgs = ["moka_py"]

[tool.coverage.paths]
# The tests run against the installed wheel; map it back to the sources so
# Codecov annotates py-src/ rather than site-packages.
source = ["py-src/moka_py", "*/site-packages/moka_py"]
