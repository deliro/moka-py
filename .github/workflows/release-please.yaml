name: "Release"

on:
  push:
    branches:
      - master
  workflow_dispatch:

# Serialize releases; never cancel an in-flight publish.
concurrency:
  group: release-please-${{ github.ref_name }}
  cancel-in-progress: false

# Reusable build workflows called below inherit these; they need `contents: read`
# for `actions/checkout`. Jobs that need more declare it themselves.
permissions:
  contents: read

jobs:
  release-please:
    name: "release-please"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the tag, GitHub Release and changelog commit
      pull-requests: write # open/update the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # ---- Everything below only runs when a release was just cut ----

  tests:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/tests.yaml

  manylinux:
    needs: [release-please, tests]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/manylinux.yaml

  musllinux:
    needs: [release-please, tests]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/musllinux.yaml

  windows:
    needs: [release-please, tests]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/windows.yaml

  macos:
    needs: [release-please, tests]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/macos.yaml

  wasm:
    needs: [release-please, tests]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/wasm.yaml

  android:
    needs: [release-please, tests]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/android.yaml

  build-sdist:
    needs: [release-please, tests]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    name: "build sdist"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Build sdist"
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist

      - name: "Upload sdist"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-sdist
          path: dist

  publish-pypi:
    name: "Publish to PyPI"
    needs: [release-please, manylinux, musllinux, windows, macos, wasm, android, build-sdist]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Used to sign the release's artifacts and upload to PyPI using trusted publisher
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1

      - name: "Install uv"
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: "Validate PyPI publication"
        run: uv publish 'wheels-*/*' --dry-run

      - name: "Generate PyPI publish attestations"
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6
        with:
          paths: |
            wheels-*/*.whl
            wheels-*/*.tar.gz

      - name: "Publish to PyPI"
        run: uv publish --trusted-publishing=always 'wheels-*/*'
