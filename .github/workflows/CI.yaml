name: "CI"

# Validation only. Releasing and publishing live in `release-please.yaml`,
# which is the single place allowed to touch the `pypi` environment.
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    name: "pre-commit"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"

      - uses: dtolnay/rust-toolchain@stable # zizmor: ignore[unpinned-uses]
        with:
          components: rustfmt

      # Runs every formatter/linter defined in .pre-commit-config.yaml:
      # ruff, typos, taplo, actionlint, zizmor, cargo fmt, whitespace/EOF checks.
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  cargo-clippy:
    name: "cargo clippy"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: github.event_name == 'pull_request'
        with:
          lookup-only: false # zizmor: ignore[cache-poisoning]

      - uses: dtolnay/rust-toolchain@stable # zizmor: ignore[unpinned-uses]
        with:
          components: clippy

      - run: cargo clippy --all-targets --all-features -- -D warnings -W clippy::style -D clippy::perf

  cargo-deny:
    name: "cargo deny"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  pip-audit:
    name: "pip audit"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install uv"
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: "Audit Python dependencies"
        run: |
          uv export --no-emit-project --all-groups --format requirements-txt > /tmp/requirements.txt
          uvx pip-audit --strict --requirement /tmp/requirements.txt

  tests:
    uses: ./.github/workflows/tests.yaml

  # Wheel builds are expensive; run the full cross-compile matrix on pull
  # requests (where a break must be caught) and let release-please.yaml
  # rebuild them at release time.
  manylinux:
    if: github.event_name == 'pull_request'
    needs: [tests, pre-commit, cargo-clippy]
    uses: ./.github/workflows/manylinux.yaml

  musllinux:
    if: github.event_name == 'pull_request'
    needs: [tests, pre-commit, cargo-clippy]
    uses: ./.github/workflows/musllinux.yaml

  windows:
    if: github.event_name == 'pull_request'
    needs: [tests, pre-commit, cargo-clippy]
    uses: ./.github/workflows/windows.yaml

  macos:
    if: github.event_name == 'pull_request'
    needs: [tests, pre-commit, cargo-clippy]
    uses: ./.github/workflows/macos.yaml

  wasm:
    if: github.event_name == 'pull_request'
    needs: [tests, pre-commit, cargo-clippy]
    uses: ./.github/workflows/wasm.yaml

  android:
    if: github.event_name == 'pull_request'
    needs: [tests, pre-commit, cargo-clippy]
    uses: ./.github/workflows/android.yaml

  build-sdist:
    name: "build sdist"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Build sdist"
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist

      - name: "Validate sdist metadata"
        run: pipx run twine check dist/*

  # Single required status check: green here means the whole PR is green.
  ci-ok:
    name: "CI ok"
    if: always()
    needs:
      - pre-commit
      - cargo-clippy
      - cargo-deny
      - pip-audit
      - tests
      - manylinux
      - musllinux
      - windows
      - macos
      - wasm
      - android
      - build-sdist
    runs-on: ubuntu-latest
    steps:
      - name: "Fail if any dependency failed"
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All checks passed"
