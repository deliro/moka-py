name: "CI"

on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: "lint & format"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: "Install uv"
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # This workflow still contains the publishing job, so caching here
          # would be a cache-poisoning vector.
          enable-cache: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: github.event_name == 'pull_request'
        with:
          lookup-only: false # zizmor: ignore[cache-poisoning]

      - uses: dtolnay/rust-toolchain@stable # zizmor: ignore[unpinned-uses]
        with:
          components: rustfmt, clippy

      # The `lint-fmt` pre-commit hook shells out to `just`
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      # Runs `just` (ruff check + format, cargo fmt, clippy) plus the
      # file-hygiene, typos, taplo, actionlint and zizmor hooks.
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  cargo-deny:
    name: "cargo deny"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  pip-audit:
    name: "pip audit"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install uv"
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # This workflow still contains the publishing job, so caching here
          # would be a cache-poisoning vector.
          enable-cache: false

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - run: just audit-py

  tests:
    uses: ./.github/workflows/tests.yaml

  manylinux:
    needs: [ tests, lint ]
    uses: ./.github/workflows/manylinux.yaml

  musllinux:
    needs: [ tests, lint ]
    uses: ./.github/workflows/musllinux.yaml

  windows:
    needs: [ tests, lint ]
    uses: ./.github/workflows/windows.yaml

  macos:
    needs: [ tests, lint ]
    uses: ./.github/workflows/macos.yaml

  wasm:
    needs: [ tests, lint ]
    uses: ./.github/workflows/wasm.yaml

  android:
    needs: [ tests, lint ]
    uses: ./.github/workflows/android.yaml

  build-sdist:
    name: "build sdist"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Build sdist"
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist

      - name: "Upload sdist"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-sdist
          path: dist

  release-pypi:
    name: "Publish to PyPI"
    runs-on: ubuntu-latest
    needs: [manylinux, musllinux, windows, macos, wasm, android, build-sdist]
    environment: pypi
    permissions:
      # Used to sign the release's artifacts and upload to PyPI using trusted publisher
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1

      - name: "Install uv"
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: "Validate PyPI publication"
        run: uv publish 'wheels-*/*' --dry-run

      - name: "Generate PyPI publish attestations"
        if: github.ref_type == 'tag'
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6
        with:
          paths: |
            wheels-*/*.whl
            wheels-*/*.tar.gz

      - name: "Publish to PyPI"
        if: github.ref_type == 'tag'
        run: uv publish --trusted-publishing=always 'wheels-*/*'
