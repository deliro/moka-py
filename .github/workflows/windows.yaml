name: "Windows"

on:
  workflow_call:

env:
  UV_LINK_MODE: copy
  #
  (^_^): &interpreters            "3.10 3.11 3.12 3.13 3.14 3.14t 3.15 3.15t pypy3.11"
  ○_○: &interpreters_without_pypy "3.10 3.11 3.12 3.13 3.14 3.14t 3.15 3.15t"
  #
  \^_^\: &is_pull_request ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  windows:
    name: "${{ matrix.platform.runner }} / ${{ matrix.platform.target }}"
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - {
            # AMD64
            runner: windows-latest,
            target: x86_64-pc-windows-msvc,
            interpreter: *interpreters,
          }
          - {
            # x86 (32-bit)
            runner: windows-latest,
            target: i686-pc-windows-msvc,
            interpreter: *interpreters_without_pypy,
          }
          - {
            # ARM64
            runner: windows-11-vs2026-arm,
            target: aarch64-pc-windows-msvc,
            interpreter: *interpreters_without_pypy,
          }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install uv"
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: *is_pull_request

      - name: "Build wheels"
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          sccache: *is_pull_request
          args: >-
            --release
            --out dist
            --interpreter ${{ matrix.platform.interpreter }}
            --features mimalloc
            --compatibility pypi

      - name: "Upload wheels"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist
