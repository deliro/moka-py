name: "tests"

on:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: "${{ matrix.os }} / python ${{ matrix.python-version }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: [
          "3.10",
          "3.11",
          "3.12",
          "3.13",
          "3.14", "3.14t",
          "3.15", "3.15t",
          "pypy3.11",
        ]
        os: [
          "ubuntu-latest",
          "windows-latest",
        ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install uv"
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: github.event_name == 'pull_request' && github.run_attempt == 1
        with:
          lookup-only: false # zizmor: ignore[cache-poisoning]
          shared-key: ${{ matrix.os }}-${{ matrix.python-version }}

      - name: "Create and activate .venv"
        shell: bash
        run: |
          uv venv .venv --python ${{ matrix.python-version }}
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            echo ".venv/Scripts" >> "$GITHUB_PATH"
            echo "PYO3_PYTHON=.venv/Scripts/python" >> "$GITHUB_ENV"
            echo "UV_LINK_MODE=copy" >> "$GITHUB_ENV"
          else
            echo ".venv/bin" >> "$GITHUB_PATH"
            echo "PYO3_PYTHON=.venv/bin/python3" >> "$GITHUB_ENV"
          fi

      - name: "Install dependencies"
        run: uv pip install --group ci

      - name: "Run maturin"
        run: maturin build --out wheel --features mimalloc

      - name: "Install built wheel"
        shell: bash
        run: uv pip install wheel/*.whl

      - name: "Run pytest"
        run: pytest tests/ -v --ignore=tests/test_benches.py
