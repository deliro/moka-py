default_stages: [pre-commit]

repos:
  # The project's own entry point: `just` runs ruff (check + format),
  # cargo fmt and clippy. Kept as-is so there is a single source of truth
  # for formatting and linting; the hooks below only add what it does not do.
  - repo: local
    hooks:
      - id: lint-fmt
        name: lint-fmt
        entry: just
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/crate-ci/typos
    rev: v1.49.0
    hooks:
      - id: typos

  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-lint
        # Do not fetch the remote schema catalog: it makes the hook fail
        # offline and in sandboxed CI.
        args: [--no-schema]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/woodruffw/zizmor-pre-commit
    rev: v1.29.0
    hooks:
      - id: zizmor
